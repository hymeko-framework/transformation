# hymeko/transformation — the HyMeKo IR→output (transformation) layer.
#   hymeko_emitter : editor IR + M2T emitters (.hymeko, SysML v2, Rust stubs, Lean 4)
#   hymeko_query   : pattern-matching query engine over the hypergraph IR
#   hymeko_formats : built-in format emitters (URDF/SDF/MJCF/DOT/Mermaid/Gazebo) — query plugin
# `core` and `parser` are external repos, pulled as git dependencies.
[workspace]
resolver = "2"
members = ["hymeko_emitter", "hymeko_query", "hymeko_formats"]

[workspace.dependencies]
hymeko_core = { git = "ssh://git@amaterasu.local:2222/hymeko/core.git", branch = "main" }
parser = { git = "ssh://git@amaterasu.local:2222/hymeko/parser.git", branch = "master" }
serde = "1.0.228"
log = "0.4.29"
