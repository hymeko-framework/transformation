# hymeko/transformation — the HyMeKo IR→output (transformation) layer.
#   hymeko_emitter : editor IR + M2T emitters (.hymeko, SysML v2, Rust stubs, Lean 4)
#   hymeko_query   : pattern-matching query engine over the hypergraph IR
#   hymeko_formats : built-in format emitters (URDF/SDF/MJCF/DOT/Mermaid/Gazebo) — query plugin
# `core` and `parser` are external repos, pulled as git dependencies.
[workspace]
resolver = "2"
members = ["hymeko_emitter", "hymeko_query", "hymeko_formats"]

[workspace.dependencies]
# Pinned to the revision this repository actually builds against. core@main has since replaced the
# three `decl_to_*` maps with a private dispatch slot (documented "option D", 2026-08-31); migrating the
# ~20 IR-construction write sites in entropy.rs / rewrite/{regen,split}.rs to the public
# `push_decl` / `bind_*_decl` API is a separate, owner-level change and is NOT done here.
hymeko_core = { git = "ssh://git@amaterasu.local:2222/hymeko/core.git", rev = "5fe2c88364573c58ad6f7882a3233f8575ecc369" }
parser = { git = "ssh://git@amaterasu.local:2222/hymeko/parser.git", branch = "master" }
serde = "1.0.228"
log = "0.4.29"
