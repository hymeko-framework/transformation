# hymeko/transformation — the HyMeKo IR→output (transformation) layer.
#   hymeko_emitter : editor IR + M2T emitters (.hymeko, SysML v2, Rust stubs, Lean 4)
#   hymeko_query   : pattern-matching query engine over the hypergraph IR
#   hymeko_geometry: the geometric/kinematic reading of the IR — shapes, links, joints, forward kinematics
#   hymeko_formats : built-in format emitters (URDF/SDF/MJCF/DOT/Mermaid/Gazebo) — query plugin
#   hymeko_optimize: IR -> constrained-optimisation problem (MNA, duals, replaceable backends)
#   hymeko_dynamics: IR -> port-Hamiltonian system (J from signed incidence, modal analysis)
#   hymeko_sources : a SourceProvider over strings, so a model compiles where there is no disk
# `core` and `parser` are external repos, pulled as git dependencies.
[workspace]
resolver = "2"
members = ["hymeko_emitter", "hymeko_query", "hymeko_geometry", "hymeko_formats", "hymeko_optimize", "hymeko_dynamics", "hymeko_sources"]

[workspace.dependencies]
# Pinned to the revision this repository actually builds against. core@main has since replaced the
# three `decl_to_*` maps with a private dispatch slot (documented "option D", 2026-08-31); migrating the
# ~20 IR-construction write sites in entropy.rs / rewrite/{regen,split}.rs to the public
# `push_decl` / `bind_*_decl` API is a separate, owner-level change and is NOT done here.
hymeko_core = { git = "ssh://git@amaterasu.local:2222/hymeko/core.git", rev = "70d0de270dcfb83e602430b42b3dcb2c6924a9f4" }
parser = { git = "ssh://git@amaterasu.local:2222/hymeko/parser.git", branch = "master" }
# The Tensor pillar's geometric algebra — SE(n) rigid motions live there, not here.
# NOTE: path only until `hymeko/tensor` is pushed with `hymeko_clifford::algebra::Se`.
hymeko_clifford = { git = "ssh://git@amaterasu.local:2222/hymeko/tensor.git", branch = "main" }
serde = "1.0.228"
log = "0.4.29"
