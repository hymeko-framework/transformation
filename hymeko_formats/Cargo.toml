[package]
name = "hymeko_formats"
version = "0.1.0"
edition = "2024"
description = "Plugin crate providing the built-in HyMeKo format emitters (URDF, SDF, MJCF, DOT, Mermaid, Gazebo world)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kyberszittya/hymeko_framework_rust"

[lib]
name = "hymeko_formats"

[dependencies]
hymeko_core = { workspace = true }
hymeko_query = { path = "../hymeko_query" }
hymeko_mechanism = { path = "../hymeko_mechanism", features = ["mesh-optimization"] }
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extensions"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "hdr"] }
hymeko_clifford = { workspace = true }
# Articulated dynamics and contact for environment and family checks; roads (kawakern::track).
kawakern = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Domain projections reuse the existing graph engine and canonical source emitter.
hymeko_graph = { workspace = true }
hymeko_emitter = { path = "../hymeko_emitter" }

[dev-dependencies]
# The road-reader test compiles its model from memory.
hymeko_sources = { path = "../hymeko_sources" }
