[package]
name = "hymeko_geometry"
version = "0.1.0"
edition = "2024"
description = "Geometric and kinematic reading of the HyMeKo IR: links, joints, shapes, frames and actuation, read into the hymeko_kinematics model"
license = "MIT OR Apache-2.0"

[lib]
name = "hymeko_geometry"
crate-type = ["rlib"]

# The layering this crate exists to restore:
#
#   hymeko_core      the IR
#   hymeko_query     pattern matching ON the IR — generic, domain-free (its stated charter)
#   hymeko_geometry  the GEOMETRIC reading of the IR — shapes, links, joints, poses  ← here
#   hymeko_formats   emitters that write that reading out (URDF, SDF, MJCF, …)
#
# `kinematics` and `transforms` used to live inside `hymeko_query`, which describes itself as a
# pattern-matching query engine; a robot's links and joints are not pattern matching. The query core
# never referenced them, so the split is clean and one-directional.
[dependencies]
hymeko_core = { workspace = true, optional = true }
hymeko_query = { path = "../hymeko_query", optional = true }
# Spatial candidate search belongs to Graph SBSH; no second partition in geometry.
hymeko_sbsh = { workspace = true, optional = true }
# SE(n) comes from the Tensor pillar's pinned geometric algebra package.
hymeko_clifford = { workspace = true, optional = true }
hymeko_tensor = { workspace = true, optional = true }
# User-approved NURBS owner; dependency-free on native and WASM.
hymeko_spline = { git = "ssh://git@192.168.1.228:2222/hymeko/tensor.git", rev = "514f7e8385a3bf7665494b94c2ae5acc4d5114a0", optional = true }
log = { workspace = true, optional = true }
# Meshes and materials come from the Geometry repository and are re-exported as
# `mesh` and `material`, so consumers keep one type identity.
hymeko_mesh = { workspace = true }
# Kinematic models, FK/IK and collision geometry (Geometry repository), re-exported with Core
# declaration handles; two_bone needs none of the model.
hymeko_kinematics = { workspace = true }
# Physics over those models (kawakern repository), re-exported under the former paths.
kawakern = { workspace = true, optional = true }
serde = { version = "1", features = ["derive", "rc"] }
# Recipe projection and the surface_prepare adapter exchange JSON.
serde_json = "1"

[features]
# Visualization consumers need only mesh/material data; numerical and IR domain
# projection modules remain enabled by default for all existing consumers.
default = ["simulation"]
simulation = ["dep:hymeko_core", "dep:hymeko_query", "dep:hymeko_sbsh", "dep:hymeko_clifford", "dep:hymeko_tensor", "dep:hymeko_spline", "dep:log", "hymeko_kinematics/model", "dep:kawakern"]
mesh-optimization = ["hymeko_mesh/mesh-optimization"]
# Canonical authoring-source projection, without pulling simulation engines.
authoring = ["dep:hymeko_core", "dep:hymeko_query"]

[dev-dependencies]
parser = { workspace = true }
hymeko_sources = { path = "../hymeko_sources" }
