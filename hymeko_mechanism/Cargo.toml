[package]
name = "hymeko_mechanism"
version = "0.1.0"
edition = "2024"
description = "Mechanisms read out of HyMeKo IR: links, joints, frames, actuation, visuals and cameras into the hymeko_kinematics model; geometry recipes"
license = "MIT OR Apache-2.0"

[lib]
name = "hymeko_mechanism"
crate-type = ["rlib"]

# The layering:
#
#   hymeko_core       the IR
#   hymeko_query      pattern matching ON the IR — generic, domain-free
#   hymeko_mechanism  mechanisms (and recipes) read out of the IR  <- here (formerly hymeko_geometry)
#   hymeko_formats    emitters that write that reading out (URDF, SDF, MJCF, ...)
#
# The computations live with their owners: hymeko_mesh and hymeko_kinematics (geometry repository),
# kawakern (physics, roads).
[dependencies]
hymeko_core = { workspace = true, optional = true }
hymeko_query = { path = "../hymeko_query", optional = true }
# SE(n) comes from the Tensor pillar's pinned geometric algebra package.
hymeko_clifford = { workspace = true, optional = true }
log = { workspace = true, optional = true }
# Meshes and materials come from the Geometry repository and are re-exported as
# `mesh` and `material`, so consumers keep one type identity.
hymeko_mesh = { workspace = true }
# Kinematic models, FK/IK and collision geometry (Geometry repository); the readers produce its
# model with Core declaration handles, two_bone needs none of it.
hymeko_kinematics = { workspace = true }
serde = { version = "1", features = ["derive", "rc"] }
# Recipe projection and the surface_prepare adapter exchange JSON.
serde_json = "1"

[features]
# Visualization consumers need only mesh/material data; numerical and IR domain
# projection modules remain enabled by default for all existing consumers.
default = ["simulation"]
simulation = ["dep:hymeko_core", "dep:hymeko_query", "dep:hymeko_clifford", "dep:log", "hymeko_kinematics/model"]
mesh-optimization = ["hymeko_mesh/mesh-optimization"]
# Canonical authoring-source projection, without pulling simulation engines.
authoring = ["dep:hymeko_core", "dep:hymeko_query"]

[dev-dependencies]
parser = { workspace = true }
hymeko_sources = { path = "../hymeko_sources" }
# The IR-to-physics integration tests run kawakern on models read here.
kawakern = { workspace = true }
