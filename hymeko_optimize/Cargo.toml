[package]
name = "hymeko_optimize"
version = "0.1.0"
edition = "2024"
description = "IR to solver-neutral constrained-optimisation problem: the typed projection"
license = "MIT OR Apache-2.0"

# cdylib so a wasm target produces a module; rlib for every other consumer.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hymeko-optimize"
path = "src/bin/solve.rs"

[features]
default = []
# The browser surface. Off by default: the projection has no business depending on wasm-bindgen to
# solve a network, and a desktop build should not carry it.
web = ["dep:wasm-bindgen", "dep:hymeko_sources"]

[dependencies]
hymeko_core = { workspace = true }
wasm-bindgen = { version = "0.2.127", optional = true }
# The shared in-memory SourceProvider, so a model compiles where there is no disk.
hymeko_sources = { path = "../hymeko_sources", optional = true }

[dev-dependencies]
hymeko_query = { path = "../hymeko_query" }
