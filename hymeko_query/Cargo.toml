[package]
name = "hymeko_query"
version = "0.1.0"
edition = "2024"
autotests = false
description = "Pattern-matching query engine for HyMeKo hypergraph IR"
license = "MIT"
repository = "https://github.com/kyberszittya/hymeko_framework_rust"

[lib]
name = "hymeko_query"
crate-type = ["rlib", "cdylib"]

[dependencies]
hymeko_core = { workspace = true }
parser = { workspace = true, optional = true }

[features]
default = ["interpret"]
interpret = ["parser"]  # AST-to-Predicate interpreter requires parser

[dev-dependencies]
# Test logging only; the library logs nothing, so consumers (renderers, wasm) do not carry a logger.
env_logger = "0.11.9"
log = "0.4.29"
# The kinematics/transforms tests moved out with their modules but still live here; cargo permits a
# dev-dependency cycle, so they can keep exercising the real crate rather than being duplicated.
hymeko_mechanism = { path = "../hymeko_mechanism" }
hymeko_formats = { path = "../hymeko_formats" }

[[test]]
name = "integration"
path = "tests/mod.rs"
