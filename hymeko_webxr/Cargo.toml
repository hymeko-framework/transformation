[package]
name = "hymeko_webxr"
version = "0.1.0"
edition = "2024"
autotests = false
description = "WebXR and spatial semantic projection over the canonical HyMeKo IR"
license = "MIT OR Apache-2.0"

[lib]
name = "hymeko_webxr"
crate-type = ["rlib"]

[dependencies]
hymeko_core = { workspace = true }
# Effective fields (a kind's value as the instance default); the query interpreter is not needed.
hymeko_query = { path = "../hymeko_query", default-features = false }

[[test]]
name = "integration"
path = "tests/mod.rs"
